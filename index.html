<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaos Island</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="webgl"></canvas>

  <div class="loader" id="loader">
    <p class="loader__text">Building the island…</p>
  </div>

  <aside class="panel">
    <h2 class="panel__title">Weather machine</h2>
    <div class="control">
      <div class="control__row">
        <label for="time">Time</label>
        <output id="timeOutput">13:00</output>
      </div>
      <input type="range" id="time" min="0" max="24" step="0.05" value="13">
    </div>
    <div class="control">
      <div class="control__row">
        <label for="rain">Rain</label>
        <output id="rainOutput">0%</output>
      </div>
      <input type="range" id="rain" min="0" max="1" step="0.01" value="0">
    </div>
    <div class="control">
      <div class="control__row">
        <label for="snow">Snow</label>
        <output id="snowOutput">0%</output>
      </div>
      <input type="range" id="snow" min="0" max="1" step="0.01" value="0">
    </div>
    <div class="control">
      <div class="control__row">
        <label for="wind">Wind</label>
        <output id="windOutput">15%</output>
      </div>
      <input type="range" id="wind" min="0" max="1" step="0.01" value="0.15">
    </div>
    <button class="lever" id="lever">
      <span class="lever__track"><span class="lever__handle"></span></span>
      <span class="lever__text"><strong>Time lever</strong><small>Rewind everything · R</small></span>
    </button>
  </aside>
  <nav class="tools" aria-label="Throw">
    <button class="tool is-active" data-tool="ball"><svg class="tool__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ffffff"/><path d="M12 2a10 10 0 0 1 8.7 5L12 12z" fill="#e8463a"/><path d="M20.7 17A10 10 0 0 1 12 22l0-10z" fill="#2f8fd8"/><path d="M3.3 17A10 10 0 0 1 3.3 7L12 12z" fill="#f6c23e"/><circle cx="12" cy="12" r="10" fill="none" stroke="#0e1726" stroke-opacity="0.25"/></svg>Beach ball<span class="tool__key">1</span></button>
    <button class="tool" data-tool="barrel"><svg class="tool__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12q2 9 0 18H6q-2-9 0-18z" fill="#9a6233"/><path d="M10 3q-1 9 0 18M14 3q1 9 0 18" stroke="#7c4b26" stroke-width="1.5" fill="none"/><path d="M5 7.5h14M5 16.5h14" stroke="#4a4f57" stroke-width="2"/></svg>Barrel<span class="tool__key">2</span></button>
    <button class="tool" data-tool="rock"><svg class="tool__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l2.5-7 5-4 6 1.5 4.5 5-1 5.5-7.5 2.5z" fill="#7d776f"/><path d="M5.5 10l5-4 6 1.5-4 4z" fill="#9a948c"/><path d="M12.5 11.5l8 1-1 5.5-7.5 2.5z" fill="#625d57"/></svg>Rock<span class="tool__key">3</span></button>
  </nav>

  <script src="js/script.js" type="module"></script>
</body>
</html>
