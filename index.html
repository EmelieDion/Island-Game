<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaos Island</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="webgl"></canvas>

  <div class="loader" id="loader">
    <p class="loader__text">Building the island…</p>
  </div>

  <aside class="panel">
    <h2 class="panel__title">Weather machine</h2>
    <div class="control">
      <div class="control__row">
        <label for="time">Time</label>
        <output id="timeOutput">13:00</output>
      </div>
      <input type="range" id="time" min="0" max="24" step="0.05" value="13">
    </div>
    <div class="control">
      <div class="control__row">
        <label for="rain">Rain</label>
        <output id="rainOutput">0%</output>
      </div>
      <input type="range" id="rain" min="0" max="1" step="0.01" value="0">
    </div>
    <div class="control">
      <div class="control__row">
        <label for="snow">Snow</label>
        <output id="snowOutput">0%</output>
      </div>
      <input type="range" id="snow" min="0" max="1" step="0.01" value="0">
    </div>
    <div class="control">
      <div class="control__row">
        <label for="wind">Wind</label>
        <output id="windOutput">15%</output>
      </div>
      <input type="range" id="wind" min="0" max="1" step="0.01" value="0.15">
    </div>
    <button class="lever" id="lever">
      <span class="lever__track"><span class="lever__handle"></span></span>
      <span class="lever__text"><strong>Time lever</strong><small>Rewind everything · R</small></span>
    </button>
  </aside>
  <nav class="tools" aria-label="Throw">
    <button class="tool is-active" data-tool="ball"><span class="tool__key">1</span>Beach ball</button>
    <button class="tool" data-tool="barrel"><span class="tool__key">2</span>Barrel</button>
    <button class="tool" data-tool="rock"><span class="tool__key">3</span>Rock</button>
  </nav>

  <script src="js/script.js" type="module"></script>
</body>
</html>
